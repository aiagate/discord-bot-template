name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install ghq for repository tests
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL https://github.com/x-motemen/ghq/releases/download/v1.10.1/ghq_linux_amd64.zip -o ghq.zip
          echo '32e380aa8ac76fdd58758cc06174d9ee5db7270bd0cbcc18138b5d36def91b6b  ghq.zip' | sha256sum --check
          unzip -q ghq.zip -d ghq
          echo "$RUNNER_TEMP/ghq/ghq_linux_amd64" >> "$GITHUB_PATH"

      - name: Run ruff format check
        run: uv run --frozen ruff format --check .

      - name: Run ruff linting
        run: uv run --frozen ruff check .

      - name: Run type checking with pyright
        run: uv run --frozen pyright

      - name: Run tests
        run: uv run --frozen pytest --cov --cov-report=term-missing
